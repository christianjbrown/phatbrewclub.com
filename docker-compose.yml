name: phatbrew

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: phatbrew
      POSTGRES_PASSWORD: phatbrew
      POSTGRES_DB: phatbrew
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phatbrew']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: phatbrew
      MINIO_ROOT_PASSWORD: phatbrew-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket on first boot and exits. Without this the first
  # upload fails against an empty MinIO.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 phatbrew phatbrew-secret &&
      mc mb --ignore-existing local/phatbrew-media &&
      mc anonymous set download local/phatbrew-media &&
      echo 'bucket ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1026:1025', '8026:8025']

volumes:
  pgdata:
  miniodata:
