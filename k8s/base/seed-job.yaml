# Loads the admin user, both venues, the beer range and events. Idempotent:
# it updates existing records rather than duplicating them, so re-running is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: cms-seed
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cms
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - until curl -sf http://cms:3000/api/access >/dev/null; do echo "waiting for cms"; sleep 5; done
      containers:
        - name: seed
          image: phatbrew/cms-migrate:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: phatbrew-config }
            - secretRef: { name: phatbrew-secrets }
          command: ["npm", "run", "seed:ci"]
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
