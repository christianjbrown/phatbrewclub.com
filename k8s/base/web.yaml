apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: phatbrew/web:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: phatbrew-config }
            - secretRef: { name: phatbrew-secrets }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 8
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
