# Schema migrations. The CMS runs in production mode, which does not push
# schema the way dev mode does, so this must complete before cms serves.
apiVersion: batch/v1
kind: Job
metadata:
  name: cms-migrate
  annotations:
    # Re-created on every apply so a new migration actually runs.
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef: { name: phatbrew-secrets }
          command: ["/bin/sh", "-c"]
          args:
            - until pg_isready -h postgres -U phatbrew; do echo "waiting for postgres"; sleep 3; done
      containers:
        - name: migrate
          image: phatbrew/cms-migrate:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: phatbrew-config }
            - secretRef: { name: phatbrew-secrets }
          command: ["npm", "run", "migrate"]
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
