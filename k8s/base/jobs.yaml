# Bucket creation. Runs to completion before uploads are possible; without it
# the first media upload fails against an empty MinIO.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            # Both are required: the bucket name lives in the ConfigMap and the
            # credentials in the Secret. Missing the ConfigMap previously left
            # $S3_BUCKET empty, and the job still reported success.
            - configMapRef: { name: phatbrew-config }
            - secretRef: { name: phatbrew-secrets }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "$S3_BUCKET" ]; then
                echo "S3_BUCKET is empty — refusing to continue" >&2
                exit 1
              fi
              until mc alias set local http://minio:9000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY"; do
                echo "waiting for minio"; sleep 3
              done
              mc mb --ignore-existing local/"$S3_BUCKET"
              mc anonymous set download local/"$S3_BUCKET"
              mc ls local/"$S3_BUCKET" >/dev/null
              echo "bucket $S3_BUCKET ready"
---
# Mirrors menus and tap lists from me&u so they are on-site and indexable,
# while staff carry on authoring in me&u. Feature-flagged: if MEANDU_SYNC_ENABLED
# is not "true" the job exits cleanly rather than writing anything.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: meandu-sync
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: phatbrew/cms-migrate:local
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: { name: phatbrew-config }
                - secretRef: { name: phatbrew-secrets }
              command: ["npm", "run", "meandu:sync"]
              resources:
                requests: { memory: 128Mi, cpu: 50m }
                limits: { memory: 512Mi }
