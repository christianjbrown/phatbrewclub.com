apiVersion: v1
kind: Service
metadata:
  name: cms
spec:
  selector: { app: cms }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
spec:
  replicas: 1
  selector:
    matchLabels: { app: cms }
  template:
    metadata:
      labels: { app: cms }
    spec:
      initContainers:
        # Do not start serving until migrations have created the schema,
        # otherwise every request 500s on a missing table.
        - name: wait-for-schema
          image: postgres:17-alpine
          envFrom:
            - secretRef: { name: phatbrew-secrets }
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: phatbrew-secrets, key: POSTGRES_PASSWORD } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              until psql -h postgres -U phatbrew -d phatbrew -c 'select 1 from venues limit 1' >/dev/null 2>&1; do
                echo "waiting for schema"; sleep 4
              done
              echo "schema present"
      containers:
        - name: cms
          image: phatbrew/cms:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: phatbrew-config }
            - secretRef: { name: phatbrew-secrets }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          # Image renditions spike memory well above idle. 512Mi is the classic
          # OOM here the moment someone uploads a phone photo from the venue.
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits: { memory: 2Gi }
