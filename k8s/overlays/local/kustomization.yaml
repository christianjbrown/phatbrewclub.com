apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: phatbrew
resources:
  - ../../base

configMapGenerator:
  - name: phatbrew-config
    literals:
      - NODE_ENV=production
      - DATABASE_URL=postgres://phatbrew:phatbrew@postgres:5432/phatbrew
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=phatbrew-media
      - S3_REGION=us-east-1
      - PAYLOAD_PUBLIC_SITE_URL=http://phatbrew.localhost:8080
      # Server-side fetches use the cluster-internal service name.
      - CMS_INTERNAL_URL=http://cms:3000
      # Anything that reaches a browser must be publicly resolvable.
      - NEXT_PUBLIC_CMS_URL=http://cms.phatbrew.localhost:8080
      - NEXT_PUBLIC_MEDIA_URL=http://media.phatbrew.localhost:8080
      - NEXT_PUBLIC_SITE_URL=http://phatbrew.localhost:8080
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=website@phatbrewclub.local
      - MAIL_TO=bookings@phatbrewclub.local
      # Commerce ships dark. Square keeps taking real orders until the
      # Stripe checkout has been proven end to end with test cards.
      - COMMERCE_ENABLED=false
      - MEANDU_SYNC_ENABLED=false
      - MEANDU_GATEWAY=https://ap1-guest-gateway.meandu.app/graphql

# Local-only values. Real environments read these from Secret Manager, never
# from a file in the repo.
secretGenerator:
  - name: phatbrew-secrets
    literals:
      - POSTGRES_PASSWORD=phatbrew
      - PAYLOAD_SECRET=local-kind-secret-not-used-elsewhere
      - S3_ACCESS_KEY_ID=phatbrew
      - S3_SECRET_ACCESS_KEY=phatbrew-secret
      - REVALIDATE_SECRET=local-kind-revalidate-secret

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: phatbrew/cms
    newTag: local
  - name: phatbrew/web
    newTag: local
